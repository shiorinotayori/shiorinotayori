<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>感想投稿フォーム - 栞のたより</title>
    <meta name="description" content="栞のたよりをご利用いただいた方からの感想を募集しています。">
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="style.css">
    <style>
        /* 感想フォーム専用スタイル */
        .feedback-form-page {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--cream) 0%, var(--warm-beige) 100%);
            padding: 4rem 0;
        }

        .feedback-form-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .form-header {
            background-color: var(--white);
            padding: 3rem;
            border-radius: 20px 20px 0 0;
            text-align: center;
            box-shadow: 0 2px 10px var(--soft-shadow);
        }

        .form-header h1 {
            font-size: 2rem;
            color: var(--primary-green);
            margin-bottom: 1.5rem;
            font-family: var(--font-title);
        }

        .form-description {
            font-size: 1.05rem;
            line-height: 1.9;
            color: var(--text-medium);
            text-align: left;
        }

        .form-body {
            background-color: var(--white);
            padding: 3rem;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 10px 40px var(--soft-shadow);
        }

        .form-group {
            margin-bottom: 2.5rem;
        }

        .form-group:last-of-type {
            margin-bottom: 0;
        }

        .form-label {
            display: block;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 1rem;
        }

        .form-label .required {
            color: #c00;
            font-size: 0.9rem;
            margin-left: 0.5rem;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .radio-option {
            display: flex;
            align-items: center;
            padding: 0.8rem;
            border: 2px solid var(--light-green);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .radio-option:hover {
            background-color: var(--cream);
            border-color: var(--primary-green);
        }

        .radio-option input[type="radio"] {
            margin-right: 0.8rem;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .radio-option label {
            cursor: pointer;
            flex: 1;
        }

        .text-input {
            width: 100%;
            padding: 0.5rem;
            font-size: 1rem;
            border: 1px solid var(--light-green);
            border-radius: 5px;
            margin-top: 0.5rem;
            font-family: var(--font-main);
        }

        .textarea {
            width: 100%;
            min-height: 120px;
            padding: 1rem;
            font-size: 1rem;
            border: 2px solid var(--light-green);
            border-radius: 10px;
            resize: vertical;
            font-family: var(--font-main);
            line-height: 1.6;
        }

        .textarea:focus {
            outline: none;
            border-color: var(--primary-green);
        }

        .form-note {
            font-size: 0.9rem;
            color: var(--text-medium);
            margin-top: 0.5rem;
            font-style: italic;
        }

        .submit-section {
            margin-top: 3rem;
            text-align: center;
        }

        .submit-button {
            background-color: var(--primary-green);
            color: var(--white);
            padding: 1.2rem 4rem;
            font-size: 1.2rem;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--soft-shadow);
            transition: all 0.3s ease;
        }

        .submit-button:hover:not(:disabled) {
            background-color: #5a8767;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(107, 158, 120, 0.3);
        }

        .submit-button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .back-link {
            display: inline-block;
            margin-top: 2rem;
            color: var(--text-medium);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: var(--primary-green);
        }

        /* 送信完了メッセージ */
        .success-message-container {
            display: none;
            background-color: var(--white);
            padding: 4rem 3rem;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 40px var(--soft-shadow);
        }

        .success-message-container h2 {
            font-size: 2rem;
            color: var(--primary-green);
            margin-bottom: 1.5rem;
            font-family: var(--font-title);
        }

        .success-message-container p {
            font-size: 1.2rem;
            color: var(--text-medium);
            margin-bottom: 2rem;
        }

        @media (max-width: 768px) {
            .form-header,
            .form-body {
                padding: 2rem 1.5rem;
            }

            .form-header h1 {
                font-size: 1.6rem;
            }

            .submit-button {
                padding: 1rem 3rem;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="feedback-form-page">
        <div class="feedback-form-container">
            <!-- フォーム -->
            <div id="formContainer">
                <div class="form-header">
                    <h1>栞のたより　感想投稿フォーム</h1>
                    <p class="form-description">
                        この度は栞のたよりをご利用いただきありがとうございました。少しでもあなたに寄り添えていると嬉しいです。以下で活動の改善やホームページに記載する声を募集しております。ご無理のない範囲でご協力いただけますと幸いです。
                    </p>
                </div>

                <div class="form-body">
                    <form id="feedbackForm">
                        <!-- どこで知ったか -->
                        <div class="form-group">
                            <label class="form-label">この活動をどこで知りましたか</label>
                            <div class="radio-group">
                                <div class="radio-option">
                                    <input type="radio" name="source" value="X" id="source-x" required>
                                    <label for="source-x">X（旧Twitter）</label>
                                </div>
                                <div class="radio-option">
                                    <input type="radio" name="source" value="知り合いに聞いた" id="source-friend">
                                    <label for="source-friend">知り合いに聞いた</label>
                                </div>
                                <div class="radio-option">
                                    <input type="radio" name="source" value="ホームページ" id="source-website">
                                    <label for="source-website">ホームページ</label>
                                </div>
                                <div class="radio-option">
                                    <input type="radio" name="source" value="その他" id="source-other">
                                    <label for="source-other">その他</label>
                                </div>
                            </div>
                            <input 
                                type="text" 
                                id="sourceOther" 
                                class="text-input" 
                                placeholder="「その他」を選択した場合は具体的にお書きください"
                                style="display: none;"
                            >
                        </div>

                        <!-- 本への感想 -->
                        <div class="form-group">
                            <label class="form-label" for="bookFeedback">本に対する感想</label>
                            <textarea 
                                id="bookFeedback" 
                                class="textarea" 
                                placeholder="自分に合っていると思った、ちょっと思ってたのと違った、など"
                            ></textarea>
                            <p class="form-note">任意項目です。無理のない範囲でお聞かせください。</p>
                        </div>

                        <!-- 活動への感想 -->
                        <div class="form-group">
                            <label class="form-label" for="activityFeedback">活動に対する感想</label>
                            <textarea 
                                id="activityFeedback" 
                                class="textarea" 
                                placeholder="応援メッセージがあるととても励みになります"
                            ></textarea>
                            <p class="form-note">任意項目です。応援メッセージをいただけると嬉しいです。</p>
                        </div>

                        <!-- 掲載許可 -->
                        <div class="form-group">
                            <label class="form-label">一部、もしくは全部をホームページに載せても良いですか</label>
                            <div class="radio-group">
                                <div class="radio-option">
                                    <input type="radio" name="publishConsent" value="同意" id="consent-yes" required>
                                    <label for="consent-yes">同意（ホームページに掲載してもOK）</label>
                                </div>
                                <div class="radio-option">
                                    <input type="radio" name="publishConsent" value="不同意" id="consent-no">
                                    <label for="consent-no">不同意（掲載しないでください）</label>
                                </div>
                            </div>
                        </div>

                        <!-- 送信ボタン -->
                        <div class="submit-section">
                            <button type="submit" class="submit-button" id="submitButton">送信</button>
                            <br>
                            <a href="index.html" class="back-link">← トップページに戻る</a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- 送信完了メッセージ -->
            <div id="successMessage" class="success-message-container">
                <h2>送信しました。</h2>
                <p>ご協力ありがとうございました。</p>
                <a href="index.html" class="cta-button">トップページに戻る</a>
            </div>
        </div>
    </div>

    <script src="feedback.js"></script>
</body>
</html>
