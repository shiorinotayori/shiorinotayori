<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>書籍名クイズ - 青空文庫</title>
    <meta name="description" content="青空文庫の名作から、一節を読んで作品名を当てるクイズです。">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- スタート画面 -->
    <div id="startScreen" class="screen active">
        <div class="start-container">
            <!-- 左側：難易度選択 -->
            <div class="difficulty-section">
                <h2 class="difficulty-heading">難易度を選んでください</h2>
                <div class="difficulty-buttons-vertical">
                    <button class="difficulty-btn" data-difficulty="easy">
                        <span class="difficulty-label">初級</span>
                        <span class="difficulty-desc">有名な作品が中心</span>
                    </button>
                    <button class="difficulty-btn" data-difficulty="medium">
                        <span class="difficulty-label">中級</span>
                        <span class="difficulty-desc">やや難しめの作品</span>
                    </button>
                    <button class="difficulty-btn" data-difficulty="hard">
                        <span class="difficulty-label">上級</span>
                        <span class="difficulty-desc">マイナーな作品も含む</span>
                    </button>
                    <button class="difficulty-btn" data-difficulty="all">
                        <span class="difficulty-label">全問題</span>
                        <span class="difficulty-desc">すべての難易度</span>
                    </button>
                </div>
            </div>

            <!-- 右側：タイトルとたよりん -->
            <div class="title-section">
                <h1 class="quiz-title">書籍名<br>クイズ</h1>
                <p class="quiz-subtitle">青空文庫の名作から<br>一節を読んで作品名を当てよう</p>
                <div class="tayorin-container">
                    <img src="tayorin_nobackground_.png" alt="たよりん" class="tayorin-image">
                </div>
            </div>
        </div>
    </div>

    <!-- クイズ画面 -->
    <div id="quizScreen" class="screen">
        <div class="container">
            <!-- 進捗表示 -->
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
                <div class="progress-text" id="progressText">問題 1 / 10</div>
            </div>

            <!-- スコア表示 -->
            <div class="score-display">
                <span id="scoreText">正解数: 0</span>
            </div>

            <!-- 問題表示エリア -->
            <div class="question-card" id="questionCard">
                <div class="excerpt-box" id="excerptBox">
                    <p id="excerptText"></p>
                </div>

                <div class="action-buttons">
                    <button id="moreBtn" class="more-btn">もっと読む</button>
                    <button id="hintBtn" class="hint-btn" style="display: none;">ヒント（著者名）</button>
                </div>

                <div id="hintDisplay" class="hint-display" style="display: none;">
                    <p><strong>著者:</strong> <span id="authorHint"></span></p>
                </div>

                <!-- フィードバックオーバーレイ -->
                <div id="feedbackOverlay" class="feedback-overlay">
                    <div id="feedback" class="feedback"></div>
                    <button id="nextBtn" class="next-btn">次の問題へ</button>
                </div>
            </div>

            <!-- 選択肢 -->
            <div class="choices" id="choicesContainer"></div>
        </div>
    </div>

    <!-- 結果画面 -->
    <div id="resultScreen" class="screen">
        <div class="container">
            <h1 class="result-title">クイズ結果</h1>

            <div class="result-card">
                <div class="result-score">
                    <p class="score-label">正解数</p>
                    <p class="score-number"><span id="finalScore">0</span> / 10</p>
                </div>

                <div class="result-message" id="resultMessage"></div>

                <div class="result-details" id="resultDetails"></div>
            </div>

            <div class="result-actions">
                <button id="retryBtn" class="retry-btn">もう一度挑戦</button>
                <a href="../index.html" class="back-link">← トップページに戻る</a>
            </div>
        </div>
    </div>

    <!-- ローディング -->
    <div id="loadingScreen" class="loading-screen">
        <div class="spinner"></div>
        <p>問題を読み込み中...</p>
    </div>

    <script src="questions-data.js"></script>
    <script src="quiz.js"></script>
</body>

</html>
