<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>診断結果 - 好きな書籍DE性格診断 - 栞のたより</title>
    <meta name="description" content="あなたの性格診断結果">
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="diagnosis-result-style.css">
</head>
<body>
    <div class="diagnosis-result-page">
        <div class="diagnosis-result-container">
            <!-- ヘッダー -->
            <div class="result-header">
                <h1 class="result-header-title">診断結果</h1>
                <div class="tayorin-result-container">
                    <img src="tayorin_nobackground_.png" alt="たよりん" class="tayorin-result">
                </div>
            </div>

            <!-- ローディング -->
            <div id="loadingContainer" class="loading-container">
                <div class="loading-message">
                    <p>診断中です...<br>少々お待ちください</p>
                    <div class="spinner"></div>
                </div>
            </div>

            <!-- 結果表示エリア -->
            <div id="resultContent" class="result-content">
                
                <!-- 1. 選ばれた5冊 -->
                <div class="result-box">
                    <h2>選ばれた5冊</h2>
                    <div id="books-content" class="content-area"></div>
                </div>

                <!-- 2. 一言診断 -->
                <div class="result-box">
                    <div class="catchphrase">
                        <span style="font-size: 0.9em; display: block; margin-bottom: 0.5rem;">あなたは</span>
                        <span id="catchphrase-content"></span>
                    </div>
                </div>

                <!-- 3. 5冊の共通分析 -->
                <div class="result-box">
                    <h2>5冊の共通分析</h2>
                    <div id="analysis-content" class="content-area"></div>
                </div>

                <!-- 4. 性格プロファイル -->
                <div class="result-box">
                    <h2>性格プロファイル</h2>
                    <div id="profile-content" class="content-area"></div>
                </div>

                <!-- 5. 長所 -->
                <div class="result-box">
                    <h2>長所</h2>
                    <div id="strengths-content" class="content-area"></div>
                </div>

                <!-- 6. 短所 -->
                <div class="result-box">
                    <h2>短所（裏返しとして現れうる傾向）</h2>
                    <div id="weaknesses-content" class="content-area"></div>
                </div>

                <!-- 7. アドバイス -->
                <div class="result-box">
                    <h2>アドバイス</h2>
                    <div id="advice-content" class="content-area"></div>
                </div>

                <!-- 8. おすすめ本 -->
                <div class="result-box">
                    <h2>おすすめ本</h2>
                    <div id="recommendations-content" class="content-area"></div>
                </div>

            </div>

            <!-- ボタン -->
            <div class="button-container">
                <a href="index.html" class="back-link">← トップページに戻る</a>
            </div>
        </div>
    </div>

    <script src="diagnosis-result-new.js"></script>
</body>
</html>
